
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pengembaraan 5 Peti Harta Karun</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 min-height:100dvh;
 padding:8px;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
 background:radial-gradient(ellipse at top,#344b69,#101b2b 65%,#070c15);
 overflow-x:hidden;
}

header{padding:3px 0}
h1{
 color:#ffd76b;
 font-size:clamp(17px,5vw,25px);
 margin:5px 0;
 text-shadow:0 0 12px gold;
}
.sub{font-size:10px;color:#d5e2ef}

.layout{
 max-width:650px;
 margin:auto;
 display:grid;
 grid-template-columns:1.2fr .8fr;
 gap:8px;
 align-items:stretch;
}

.panel{
 background:#ffffff10;
 border:1px solid #ffffff30;
 border-radius:13px;
 padding:9px 7px;
 min-width:0;
}

#stage{
 color:#ffdc7a;
 font-size:15px;
 font-weight:bold;
}

#description{
 font-size:12px;
 margin:5px 0;
 color:#dce9fa;
}

#chest{
 display:block;
 margin:5px auto;
 width:100%;
 height:105px;
 border:0;
 background:none;
 font-size:76px;
 cursor:pointer;
 touch-action:none;
 user-select:none;
 -webkit-user-select:none;
 filter:drop-shadow(0 0 12px #e9ad43);
}

#goal{
 color:#ffe7a4;
 font-size:12px;
 font-weight:bold;
 line-height:1.5;
 min-height:34px;
}

#counter{
 font-size:24px;
 color:#7dffc0;
 font-weight:bold;
 margin:7px 0;
}

#status{
 font-size:12px;
 color:#e6efff;
 min-height:33px;
 line-height:1.4;
 padding:4px;
}

#mic{
 color:#a8d9ff;
 font-size:10px;
 margin:3px;
}

.inventory-title{
 font-size:12px;
 color:#ffdf8a;
 font-weight:bold;
 margin:3px 0 8px;
}

#inventory{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
}

.item{
 background:#ffffff12;
 border:1px solid #ffffff30;
 padding:7px 3px;
 border-radius:9px;
 min-width:0;
 font-size:10px;
 color:#e5e9f0;
}

.item span{
 display:block;
 font-size:25px;
 margin-bottom:4px;
}

.locked{opacity:.35;filter:grayscale(1)}

.actions{
 max-width:650px;
 margin:9px auto;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.action{
 min-height:37px;
 border:0;
 border-radius:9px;
 padding:8px 4px;
 font-size:11px;
 font-weight:bold;
 cursor:pointer;
}

#next{
 display:none;
 background:linear-gradient(90deg,#ffd34d,#fff0a4);
 color:#332400;
}

#restart{
 background:#ffffff17;
 border:1px solid #d7bd79;
 color:white;
}

#reward{
 display:none;
 max-width:650px;
 margin:8px auto;
 padding:10px;
 border:1px solid #f4d47d;
 background:#ffffff12;
 border-radius:12px;
 color:#ffe37b;
 font-weight:bold;
 font-size:15px;
 line-height:1.4;
}

#rewardIcon{
 font-size:40px;
 display:block;
 margin:3px;
 filter:drop-shadow(0 0 10px gold);
}

#rewardText{font-size:13px}

#finalText{
 font-size:clamp(17px,5vw,26px);
 line-height:1.5;
 color:#ffdf79;
}

.coin{
 position:fixed;
 top:-40px;
 font-size:25px;
 z-index:10;
 pointer-events:none;
 animation:rain var(--duration) linear forwards;
}

.spark{
 position:fixed;
 top:45%;
 left:50%;
 font-size:30px;
 z-index:8;
 pointer-events:none;
 animation:burst 2s ease-out forwards;
}

@keyframes rain{
 to{
  transform:translate(var(--side),110vh) rotate(900deg);
  opacity:.2;
 }
}

@keyframes burst{
 to{
  transform:translate(var(--x),var(--y)) rotate(700deg) scale(1.5);
  opacity:0;
 }
}

@keyframes shake{
 0%,100%{transform:translateX(0)}
 25%{transform:translateX(-15px)}
 50%{transform:translateX(15px)}
 75%{transform:translateX(-10px)}
}

@keyframes glow{
 50%{filter:drop-shadow(0 0 30px gold) brightness(1.7)}
}

@media(max-width:360px){
 body{padding:5px}
 .layout{gap:5px}
 .panel{padding:7px 4px}
 #chest{height:85px;font-size:65px}
 .item{font-size:9px}
 .item span{font-size:21px}
}
</style>
</head>

<body>

<header>
 <h1>🏆 PENGEMBARAAN HARTA KARUN 🏆</h1>
 <div class="sub">LIMA PETI • LIMA GANJARAN • SATU PENGEMBARAAN</div>
</header>

<div class="layout">

 <div class="panel">
  <div id="stage">PERINGKAT 1 / 5</div>
  <div id="description">Peti kayu purba</div>

  <button id="chest">🪵</button>

  <div id="goal">BISMILLAHIRRAHMANIRRAHIM 3 KALI</div>
  <div id="counter">0 / 3</div>
  <div id="status">Tekan dan tahan peti sambil menyebut zikir.</div>
  <div id="mic">🎤 Mikrofon sedia</div>
 </div>

 <div class="panel">
  <div class="inventory-title">🎒 KOLEKSI GANJARAN</div>
  <div id="inventory"></div>
 </div>

</div>

<div id="reward">
 <span id="rewardIcon"></span>
 <div id="rewardText"></div>
</div>

<div class="actions">
 <button class="action" id="restart" onclick="location.reload()">
  🔄 MULA SEMULA
 </button>
 <button class="action" id="next">
  PETI SETERUSNYA ➜
 </button>
</div>

<script>
const Speech =
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;

const chest=document.getElementById("chest");
const stageText=document.getElementById("stage");
const description=document.getElementById("description");
const goal=document.getElementById("goal");
const counter=document.getElementById("counter");
const statusBox=document.getElementById("status");
const mic=document.getElementById("mic");
const rewardBox=document.getElementById("reward");
const rewardIcon=document.getElementById("rewardIcon");
const rewardText=document.getElementById("rewardText");
const inventory=document.getElementById("inventory");
const nextButton=document.getElementById("next");

let stage=0;
let holding=false;
let finished=false;
let active=false;
let recognition=null;
let counts={};
let processed=new Set();

const stages=[

 {
  name:"Peti kayu purba",
  icon:"🪵",
  phrases:["bismillah"],
  required:[3],
  goal:"BISMILLAHIRRAHMANIRRAHIM 3 KALI",
  reward:"🔑",
  rewardName:"KUNCI PERAK BERSINAR",
  rewardAudio:"Tahniah! Anda mendapat kunci perak yang bersinar.",
  eligible:"Tahniah! Kamu layak membuka peti ke dua."
 },

 {
  name:"Peti kayu moden",
  icon:"🪵",
  phrases:["subhanallah"],
  required:[3],
  goal:"SUBHANALLAH 3 KALI",
  reward:"🗝️",
  rewardName:"KUNCI EMAS BERSINAR",
  rewardAudio:"Hebat! Anda mendapat kunci emas yang bersinar.",
  eligible:"Tahniah! Kamu layak membuka peti ke tiga."
 },

 {
  name:"Peti besi buruk",
  icon:"🧰",
  phrases:["allahuakbar"],
  required:[3],
  goal:"ALLAHU AKBAR 3 KALI",
  reward:"🗺️",
  rewardName:"PETA HARTA KARUN EMAS",
  rewardAudio:"Kunci emas berjaya membuka peti besi. Anda mendapat peta harta karun emas yang bersinar.",
  eligible:"Tahniah! Kamu layak membuka peti ke empat."
 },

 {
  name:"Peti besi perak",
  icon:"🛡️",
  phrases:["subhanallah","allahuakbar","alhamdulillah"],
  required:[1,1,1],
  goal:"SUBHANALLAH 1X • ALLAHU AKBAR 1X • ALHAMDULILLAH 1X",
  reward:"💎",
  rewardName:"RANTAI BERLIAN WARNA-WARNI",
  rewardAudio:"Tahniah! Anda mendapat rantai berlian warna-warni yang bersinar.",
  eligible:"Tahniah! Kamu layak membuka peti ke lima."
 },

 {
  name:"Peti besi emas",
  icon:"👑",
  phrases:["alhamdulillah"],
  required:[3],
  goal:"ALHAMDULILLAH 3 KALI",
  reward:"🪙",
  rewardName:"HUJAN SYILING EMAS",
  rewardAudio:"Tahniah, anda berjaya akhiri permainan ini. Tapi, sebanyak mana pun harta yang kamu miliki di dunia, akhirat itu lebih hebat dan lebih berharga. Sekian, terima kasih."
 }
];

const aliases={
 bismillah:[
  "bismillahirrahmanirrahim",
  "bismillahirrohmanirrohim",
  "bismillahirrahmanirrohim",
  "bismillahirrohmanirrahim",
  "bismillah"
 ],
 subhanallah:[
  "subhanallah","subahanallah","subhan allah"
 ],
 allahuakbar:[
  "allahuakbar","allahu akbar",
  "allah akbar","allahuakabr","allahu akabr"
 ],
 alhamdulillah:[
  "alhamdulillah","alhamdulilah"
 ]
};

function normalize(text){
 return text.toLowerCase()
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .replace(/[^a-z]/g,"");
}

function countPhrase(text,key){
 const normalized=normalize(text);
 let maximum=0;

 for(const alias of aliases[key]){
  const phrase=normalize(alias);
  if(!phrase)continue;

  let total=0;
  let pos=0;

  while((pos=normalized.indexOf(phrase,pos))!==-1){
   total++;
   pos+=phrase.length;
  }

  maximum=Math.max(maximum,total);
 }
 return maximum;
}

function speak(text,callback){
 if(!("speechSynthesis" in window)){
  if(callback)callback();
  return;
 }

 speechSynthesis.cancel();

 const message=new SpeechSynthesisUtterance(text);
 message.lang="ms-MY";
 message.rate=.9;
 message.pitch=1.05;
 message.volume=1;

 const voices=speechSynthesis.getVoices();
 const malay=voices.find(v=>
  v.lang.toLowerCase().startsWith("ms")
 );

 if(malay)message.voice=malay;

 message.onend=()=>{if(callback)callback()};
 message.onerror=()=>{if(callback)callback()};

 speechSynthesis.speak(message);
}

function renderInventory(){
 const items=[
  {icon:"🔑",name:"Kunci perak",filter:"grayscale(1) brightness(1.7)"},
  {icon:"🗝️",name:"Kunci emas",filter:"sepia(1) saturate(2)"},
  {icon:"🗺️",name:"Peta harta",filter:"none"},
  {icon:"💎",name:"Rantai berlian",filter:"none"}
 ];

 inventory.innerHTML=items.map((item,i)=>{
  const unlocked=i<stage;
  return `
   <div class="item ${unlocked?"":"locked"}">
    <span style="filter:${item.filter}">${unlocked?item.icon:"🔒"}</span>
    ${item.name}
   </div>
  `;
 }).join("");
}

function render(){
 const s=stages[stage];

 stageText.innerText="PERINGKAT "+(stage+1)+" / 5";
 description.innerText=s.name;
 chest.innerText=s.icon;
 chest.style.display="block";
 chest.style.animation="";
 goal.innerText=s.goal;

 counts={};
 processed=new Set();

 updateCounter();

 statusBox.innerText="Tekan dan tahan peti sambil sebut zikir.";
 mic.innerText="🎤 Mikrofon sedia";

 rewardBox.style.display="none";
 nextButton.style.display="none";

 finished=false;
 holding=false;

 renderInventory();
}

function updateCounter(){
 const s=stages[stage];

 counter.innerText=s.phrases.map((p,i)=>
  (counts[p]||0)+" / "+s.required[i]
 ).join("   ");
}

function beginVoice(){
 if(!Speech){
  mic.innerText="Browser tidak menyokong suara. Cuba Chrome.";
  return;
 }

 if(active||finished)return;

 recognition=new Speech();
 recognition.lang="ms-MY";
 recognition.continuous=true;
 recognition.interimResults=true;
 recognition.maxAlternatives=1;

 recognition.onstart=()=>{
  active=true;
  mic.innerText="🎤 MIKROFON AKTIF";
 };

 recognition.onresult=(event)=>{
  if(!holding||finished)return;

  for(let i=event.resultIndex;i<event.results.length;i++){

   const result=event.results[i];

   if(!result.isFinal)continue;

   const resultId=stage+"-"+i;

   if(processed.has(resultId))continue;
   processed.add(resultId);

   const transcript=result[0].transcript;
   const s=stages[stage];

   s.phrases.forEach((phrase,index)=>{
    const found=countPhrase(transcript,phrase);

    if(found>0){
     counts[phrase]=Math.min(
      s.required[index],
      (counts[phrase]||0)+found
     );
    }
   });

   updateCounter();

   const done=s.phrases.every((p,i)=>
    (counts[p]||0)>=s.required[i]
   );

   statusBox.innerText=done
    ?"Alhamdulillah! Misi berjaya!"
    :"🎤 Suara dikesan! Teruskan...";

   if(done){
    completeStage();
    return;
   }
  }
 };

 recognition.onerror=(event)=>{
  if(!finished){
   mic.innerText="Mikrofon: "+event.error;
  }
 };

 recognition.onend=()=>{
  active=false;

  if(holding&&!finished){
   try{recognition.start()}catch(e){}
  }
 };

 try{
  recognition.start();
 }catch(e){
  mic.innerText="Tekan semula untuk cuba.";
 }
}

chest.addEventListener("pointerdown",e=>{
 e.preventDefault();

 if(finished)return;

 holding=true;
 chest.setPointerCapture(e.pointerId);

 beginVoice();
});

function release(){
 if(!holding)return;

 holding=false;

 if(recognition){
  try{recognition.stop()}catch(e){}
 }

 if(!finished){
  statusBox.innerText="Jari dilepaskan. Sambung tekan dan tahan.";
 }
}

chest.addEventListener("pointerup",release);
chest.addEventListener("pointercancel",release);

function burst(symbol,number=60){
 for(let i=0;i<number;i++){
  const el=document.createElement("div");
  el.className="spark";
  el.innerText=symbol;

  el.style.setProperty("--x",
   (Math.random()-.5)*800+"px");

  el.style.setProperty("--y",
   (Math.random()-.5)*750+"px");

  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2100);
 }
}

function rainCoins(){
 for(let i=0;i<110;i++){
  setTimeout(()=>{
   const el=document.createElement("div");
   el.className="coin";
   el.innerText=Math.random()>.5?"🪙":"💰";

   el.style.left=Math.random()*100+"vw";
   el.style.setProperty("--side",
    (Math.random()-.5)*150+"px");

   el.style.setProperty("--duration",
    (2+Math.random()*3)+"s");

   document.body.appendChild(el);
   setTimeout(()=>el.remove(),5500);
  },i*35);
 }
}

function completeStage(){
 if(finished)return;

 finished=true;
 holding=false;

 if(recognition){
  recognition.onend=null;
  try{recognition.stop()}catch(e){}
 }

 active=false;

 const s=stages[stage];

 chest.style.animation="shake .5s";
 chest.innerText="💥";

 statusBox.innerText="PETI BERJAYA DIBUKA!";

 setTimeout(()=>{
  chest.style.animation="glow 1.2s infinite";
  chest.innerText=s.reward;

  burst(stage===4?"🪙":s.reward,
   stage===4?100:60);

  rewardBox.style.display="block";
  rewardIcon.innerText=s.reward;
  rewardText.innerText=s.rewardName;

  if(stage===4){
   rainCoins();

   nextButton.style.display="none";
   statusBox.innerText="ANDA TELAH MENAMATKAN PERMAINAN!";

   speak(s.rewardAudio);

  }else{
   nextButton.style.display="block";

   statusBox.innerText=
    "MISI SELESAI! GANJARAN BERJAYA DIPEROLEH.";

   speak(
    s.rewardAudio+" "+s.eligible
   );
  }

 },800);
}

nextButton.addEventListener("click",()=>{
 if(!finished||stage>=4)return;

 stage++;
 render();
});

render();

if("speechSynthesis" in window){
 speechSynthesis.getVoices();
}
</script>

</body>
</html>
