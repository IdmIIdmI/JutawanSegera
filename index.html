
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pengembaraan 5 Peti Harta Karun</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:10px;
 min-height:100vh;min-height:100dvh;
 color:white;font-family:Arial,sans-serif;
 text-align:center;
 background:radial-gradient(ellipse at top,#405b7c,#14243a 65%,#080e19);
}
header{padding:5px}
h1{
 color:#ffda78;font-size:23px;margin:5px;
 text-shadow:0 0 12px gold;
}
.sub{font-size:12px;color:#d5e2ef}

.layout{
 width:100%;max-width:600px;
 margin:10px auto;
 display:grid;
 grid-template-columns:1.15fr .85fr;
 gap:10px;
 align-items:stretch;
}
.panel{
 background:#ffffff12;
 border:1px solid #ffffff38;
 border-radius:15px;
 padding:12px 9px;
 min-width:0;
}
#stage{
 color:#ffdc7a;font-size:18px;
 font-weight:bold;
}
#description{
 font-size:15px;margin:8px 0;
 color:#e5edfa;
}
#chest{
 display:block;margin:8px auto;
 width:100%;height:130px;
 border:0;background:none;
 font-size:100px;
 cursor:pointer;
 touch-action:none;
 user-select:none;
 -webkit-user-select:none;
 filter:drop-shadow(0 0 16px #e9ad43);
}
#goal{
 color:#ffe7a4;
 font-size:14px;
 font-weight:bold;
 line-height:1.5;
 min-height:40px;
}
#counter{
 font-size:32px;
 color:#7dffc0;
 font-weight:bold;
 margin:10px 0;
}
#status{
 font-size:14px;
 color:#f0f3fa;
 min-height:42px;
 line-height:1.5;
}
#mic{
 color:#a8d9ff;font-size:12px;
 margin-top:6px;
}
.inventory-title{
 font-size:15px;
 color:#ffdf8a;
 font-weight:bold;
 margin:5px 0 12px;
}
#inventory{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}
.item{
 background:#ffffff14;
 border:1px solid #ffffff38;
 padding:10px 4px;
 border-radius:11px;
 min-width:0;
 font-size:12px;
 color:#fff;
}
.item span{
 display:block;
 font-size:30px;
 margin-bottom:5px;
}
.locked{opacity:.35;filter:grayscale(1)}

#reward{
 display:none;
 width:100%;max-width:600px;
 margin:12px auto;
 padding:14px;
 border:1px solid #f4d47d;
 background:#ffffff13;
 border-radius:14px;
 color:#ffe37b;
 font-weight:bold;
 font-size:18px;
 line-height:1.5;
}
#rewardIcon{
 font-size:55px;display:block;
 filter:drop-shadow(0 0 12px gold);
}
#rewardText{font-size:16px}

.actions{
 width:100%;max-width:600px;
 margin:10px auto;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.action{
 min-height:45px;
 border:0;border-radius:11px;
 padding:10px 5px;
 font-size:13px;
 font-weight:bold;
 cursor:pointer;
}
#next{
 display:none;
 background:linear-gradient(90deg,#ffd34d,#fff0a4);
 color:#332400;
}
#restart{
 background:#ffffff17;
 border:1px solid #d7bd79;
 color:white;
}
.coin{
 position:fixed;top:-40px;
 font-size:28px;z-index:10;
 pointer-events:none;
 animation:rain var(--duration) linear forwards;
}
.spark{
 position:fixed;top:45%;left:50%;
 font-size:34px;z-index:8;
 pointer-events:none;
 animation:burst 2s ease-out forwards;
}
@keyframes rain{
 to{
  transform:translate(var(--side),110vh) rotate(900deg);
  opacity:.1;
 }
}
@keyframes burst{
 to{
  transform:translate(var(--x),var(--y)) rotate(700deg) scale(1.5);
  opacity:0;
 }
}
@keyframes shake{
 0%,100%{transform:translateX(0)}
 25%{transform:translateX(-15px)}
 50%{transform:translateX(15px)}
 75%{transform:translateX(-10px)}
}
@keyframes glow{
 50%{filter:drop-shadow(0 0 30px gold) brightness(1.7)}
}
@media(max-width:370px){
 body{padding:6px}
 .layout{gap:6px}
 .panel{padding:8px 5px}
 #chest{height:105px;font-size:80px}
 #counter{font-size:27px}
 .item{font-size:10px}
 .item span{font-size:25px}
}
</style>
</head>

<body>

<header>
 <h1>🏆 PENGEMBARAAN HARTA KARUN 🏆</h1>
 <div class="sub">LIMA PETI • LIMA GANJARAN • SATU PENGEMBARAAN</div>
</header>

<div class="layout">

 <div class="panel">
  <div id="stage">PERINGKAT 1 / 5</div>
  <div id="description">Peti kayu purba</div>

  <button id="chest">🪵</button>

  <div id="goal">BISMILLAHIRRAHMANIRRAHIM 3 KALI</div>
  <div id="counter">0 / 3</div>
  <div id="status">Tekan dan tahan peti sambil menyebut zikir.</div>
  <div id="mic">🎤 Mikrofon sedia</div>
 </div>

 <div class="panel">
  <div class="inventory-title">🎒 KOLEKSI GANJARAN</div>
  <div id="inventory"></div>
 </div>

</div>

<div id="reward">
 <span id="rewardIcon"></span>
 <div id="rewardText"></div>
</div>

<div class="actions">
 <button class="action" id="restart" onclick="location.reload()">
  🔄 MULA SEMULA
 </button>
 <button class="action" id="next">
  PETI SETERUSNYA ➜
 </button>
</div>

<script>
const Speech =
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;

const chest=document.getElementById("chest");
const stageText=document.getElementById("stage");
const description=document.getElementById("description");
const goal=document.getElementById("goal");
const counter=document.getElementById("counter");
const statusBox=document.getElementById("status");
const mic=document.getElementById("mic");
const rewardBox=document.getElementById("reward");
const rewardIcon=document.getElementById("rewardIcon");
const rewardText=document.getElementById("rewardText");
const inventory=document.getElementById("inventory");
const nextButton=document.getElementById("next");

let stage=0;
let holding=false;
let finished=false;
let active=false;
let recognition=null;
let counts={};
let sessionNumber=0;

const stages=[
 {
  name:"Peti kayu purba",
  icon:"🪵",
  phrases:["bismillah"],
  required:[3],
  goal:"BISMILLAHIRRAHMANIRRAHIM 3 KALI",
  reward:"silver",
  rewardName:"KUNCI PERAK BERSINAR",
  rewardAudio:"Tahniah! Anda mendapat kunci perak yang bersinar.",
  eligible:"Tahniah! Kamu layak membuka peti kedua."
 },
 {
  name:"Peti kayu moden",
  icon:"🪵",
  phrases:["subhanallah"],
  required:[3],
  goal:"SUBHANALLAH 3 KALI",
  reward:"gold",
  rewardName:"KUNCI EMAS BERSINAR",
  rewardAudio:"Hebat! Anda mendapat kunci emas yang bersinar.",
  eligible:"Tahniah! Kamu layak membuka peti ketiga."
 },
 {
  name:"Peti besi buruk",
  icon:"🧰",
  phrases:["allahuakbar"],
  required:[3],
  goal:"ALLAHU AKBAR 3 KALI",
  reward:"map",
  rewardName:"PETA HARTA KARUN EMAS",
  rewardAudio:"Kunci emas berjaya membuka peti besi. Anda mendapat peta harta karun emas yang bersinar.",
  eligible:"Tahniah! Kamu layak membuka peti keempat."
 },
 {
  name:"Peti besi perak",
  icon:"🛡️",
  phrases:["subhanallah","allahuakbar","alhamdulillah"],
  required:[1,1,1],
  goal:"SUBHANALLAH 1X • ALLAHU AKBAR 1X • ALHAMDULILLAH 1X",
  reward:"diamond",
  rewardName:"RANTAI BERLIAN WARNA-WARNI",
  rewardAudio:"Tahniah! Anda mendapat rantai berlian warna-warni yang bersinar.",
  eligible:"Tahniah! Kamu layak membuka peti kelima."
 },
 {
  name:"Peti besi emas",
  icon:"👑",
  phrases:["alhamdulillah"],
  required:[3],
  goal:"ALHAMDULILLAH 3 KALI",
  reward:"coins",
  rewardName:"HUJAN SYILING EMAS"
 }
];

const aliases={
 bismillah:[
  "bismillahirrahmanirrahim",
  "bismillahirrohmanirrohim",
  "bismillahirrahmanirrohim",
  "bismillahirrohmanirrahim",
  "bismillah"
 ],
 subhanallah:[
  "subhanallah","subahanallah","subhan allah"
 ],
 allahuakbar:[
  "allahuakbar","allahu akbar",
  "allah akbar","allahuakabr","allahu akabr"
 ],
 alhamdulillah:[
  "alhamdulillah","alhamdulilah"
 ]
};

function normalize(text){
 return text.toLowerCase()
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .replace(/[^a-z]/g,"");
}

// Kesan perkataan tanpa mengira berapa kali ia
// diulang dalam satu keputusan suara.
function hasPhrase(text,key){
 const normalized=normalize(text);
 return aliases[key].some(alias=>
  normalized.includes(normalize(alias))
 );
}

// Ikon kunci perak dan emas yang berbeza warna.
function keySVG(type){
 const silver=type==="silver";
 const id=silver?"silverMetal":"goldMetal";
 return `
 <svg width="64" height="64" viewBox="0 0 100 100"
      style="filter:drop-shadow(0 0 8px ${silver?"#dceaff":"#ffd34d"})">
  <defs>
   <linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="${silver?"#ffffff":"#fff4a6"}"/>
    <stop offset="45%" stop-color="${silver?"#b9c7d8":"#ffcb32"}"/>
    <stop offset="100%" stop-color="${silver?"#64758b":"#a86a00"}"/>
   </linearGradient>
  </defs>
  <circle cx="29" cy="30" r="19"
    fill="none" stroke="url(#${id})" stroke-width="11"/>
  <path d="M43 43 L79 79 L89 69 L81 61 L89 53 L78 42 L66 54 L55 43"
    fill="none" stroke="url(#${id})" stroke-width="10"
    stroke-linejoin="round"/>
 </svg>`;
}

function rewardHTML(type){
 if(type==="silver")return keySVG("silver");
 if(type==="gold")return keySVG("gold");
 if(type==="map")return "🗺️";
 if(type==="diamond")return "💎";
 return "🪙";
}

function speak(text,callback){
 if(!("speechSynthesis" in window)){
  if(callback)callback();
  return;
 }

 speechSynthesis.cancel();

 const message=new SpeechSynthesisUtterance(text);
 message.lang="ms-MY";
 message.rate=.88;
 message.pitch=1.05;
 message.volume=1;

 const voices=speechSynthesis.getVoices();
 const malay=voices.find(v=>
  v.lang.toLowerCase().startsWith("ms")
 );

 if(malay)message.voice=malay;

 message.onend=()=>{if(callback)callback()};
 message.onerror=()=>{if(callback)callback()};

 speechSynthesis.speak(message);
}

function renderInventory(){
 const items=[
  {icon:keySVG("silver"),name:"Kunci perak",type:"silver"},
  {icon:keySVG("gold"),name:"Kunci emas",type:"gold"},
  {icon:"🗺️",name:"Peta harta",type:"map"},
  {icon:"💎",name:"Rantai berlian",type:"diamond"}
 ];

 inventory.innerHTML=items.map((item,i)=>{
  const unlocked=i<stage;
  return `
   <div class="item ${unlocked?"":"locked"}">
    <span>${unlocked?item.icon:"🔒"}</span>
    ${item.name}
   </div>`;
 }).join("");
}

function updateCounter(){
 const s=stages[stage];
 counter.innerText=s.phrases.map((p,i)=>
  (counts[p]||0)+" / "+s.required[i]
 ).join("   ");
}

function render(){
 const s=stages[stage];

 stageText.innerText="PERINGKAT "+(stage+1)+" / 5";
 description.innerText=s.name;
 chest.innerText=s.icon;
 chest.style.display="block";
 chest.style.animation="";
 goal.innerText=s.goal;

 counts={};
 updateCounter();

 statusBox.innerText="Tekan dan tahan peti sambil sebut zikir.";
 mic.innerText="🎤 Mikrofon sedia";

 rewardBox.style.display="none";
 nextButton.style.display="none";

 finished=false;
 holding=false;

 renderInventory();
}

function beginVoice(){
 if(!Speech){
  mic.innerText="Browser tidak menyokong suara. Cuba Chrome.";
  return;
 }

 if(active||finished)return;

 const thisSession=++sessionNumber;

 recognition=new Speech();
 recognition.lang="ms-MY";
 recognition.continuous=true;
 recognition.interimResults=false;
 recognition.maxAlternatives=1;

 recognition.onstart=()=>{
  active=true;
  mic.innerText="🎤 MIKROFON AKTIF";
 };

 recognition.onresult=(event)=>{
  if(!holding||finished||thisSession!==sessionNumber)return;

  for(let i=event.resultIndex;i<event.results.length;i++){

   const result=event.results[i];
   if(!result.isFinal)continue;

   const transcript=result[0].transcript;
   const s=stages[stage];

   // SATU keputusan suara hanya boleh tambah SATU
   // walaupun pengenal suara mendengar perkataan berulang.
   let detected=false;

   for(let index=0;index<s.phrases.length;index++){
    const phrase=s.phrases[index];

    if(hasPhrase(transcript,phrase) &&
       (counts[phrase]||0)<s.required[index]){
      counts[phrase]=(counts[phrase]||0)+1;
      detected=true;
      break;
    }
   }

   updateCounter();

   if(detected){
    const done=s.phrases.every((p,i)=>
     (counts[p]||0)>=s.required[i]
    );

    statusBox.innerText=done
     ?"Alhamdulillah! Misi berjaya!"
     :"Bagus! Bacaan diterima. Teruskan!";
   }

   if(s.phrases.every((p,i)=>
     (counts[p]||0)>=s.required[i])){
    completeStage();
    return;
   }
  }
 };

 recognition.onerror=(event)=>{
  if(!finished){
   mic.innerText="Mikrofon: "+event.error;
  }
 };

 recognition.onend=()=>{
  active=false;
  if(holding&&!finished&&thisSession===sessionNumber){
   beginVoice();
  }
 };

 try{
  recognition.start();
 }catch(e){
  mic.innerText="Tekan semula untuk cuba.";
 }
}

chest.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(finished)return;

 holding=true;
 chest.setPointerCapture(e.pointerId);
 beginVoice();
});

function release(){
 if(!holding)return;
 holding=false;

 // Hentikan sesi lama supaya keputusan suara
 // yang lewat tidak dikira selepas jari dilepaskan.
 sessionNumber++;

 if(recognition){
  recognition.onend=null;
  try{recognition.stop()}catch(e){}
 }

 active=false;

 if(!finished){
  statusBox.innerText="Jari dilepaskan. Tekan dan tahan semula.";
 }
}

chest.addEventListener("pointerup",release);
chest.addEventListener("pointercancel",release);

function burst(symbol,number=60){
 for(let i=0;i<number;i++){
  const el=document.createElement("div");
  el.className="spark";
  el.innerText=symbol;
  el.style.setProperty("--x",(Math.random()-.5)*800+"px");
  el.style.setProperty("--y",(Math.random()-.5)*750+"px");
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2100);
 }
}

function rainCoins(){
 for(let i=0;i<110;i++){
  setTimeout(()=>{
   const el=document.createElement("div");
   el.className="coin";
   el.innerText=Math.random()>.5?"🪙":"💰";
   el.style.left=Math.random()*100+"vw";
   el.style.setProperty("--side",(Math.random()-.5)*150+"px");
   el.style.setProperty("--duration",(2+Math.random()*3)+"s");
   document.body.appendChild(el);
   setTimeout(()=>el.remove(),5500);
  },i*35);
 }
}

function completeStage(){
 if(finished)return;

 finished=true;
 holding=false;
 sessionNumber++;

 if(recognition){
  recognition.onend=null;
  try{recognition.stop()}catch(e){}
 }
 active=false;

 const s=stages[stage];

 chest.style.animation="shake .5s";
 chest.innerText="💥";
 statusBox.innerText="PETI BERJAYA DIBUKA!";

 setTimeout(()=>{
  chest.style.animation="glow 1.2s infinite";
  chest.innerHTML=rewardHTML(s.reward);

  burst(stage===4?"🪙":s.reward==="silver"?"✨":s.reward==="gold"?"✨":s.reward,stage===4?100:60);

  rewardBox.style.display="block";
  rewardIcon.innerHTML=rewardHTML(s.reward);
  rewardText.innerText=s.rewardName;

  if(stage===4){
   rainCoins();
   nextButton.style.display="none";
   statusBox.innerText="ANDA TELAH MENAMATKAN PERMAINAN!";

   speak(
    "Tahniah, anda berjaya akhiri permainan ini. Tapi, sebanyak mana pun harta yang kamu miliki di dunia, akhirat itu lebih hebat dan lebih berharga. Sekian, terima kasih."
   );

  }else{
   nextButton.style.display="block";
   statusBox.innerText="MISI SELESAI! GANJARAN BERJAYA DIPEROLEH.";

   speak(s.rewardAudio+" "+s.eligible);
  }

  renderInventory();

 },800);
}

nextButton.addEventListener("click",()=>{
 if(!finished||stage>=4)return;
 stage++;
 render();
});

render();
renderInventory();

if("speechSynthesis" in window){
 speechSynthesis.getVoices();
}
</script>
</body>
</html>
